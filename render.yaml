# Render Blueprint (альтернатива MonsterASP.NET): New → Blueprint → оберіть цей репозиторій.
# На Render диск тимчасовий, тому тут потрібні хмарна БД (Neon) і Google Drive.
# Значення з "sync: false" Render попросить ввести під час створення.
services:
  - type: web
    name: works-archive
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./WorksArchive/Dockerfile
    dockerContext: ./WorksArchive
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__Default
        sync: false
      - key: Storage__Provider
        value: GoogleDrive
      - key: Storage__AllowLocal
        value: "false"

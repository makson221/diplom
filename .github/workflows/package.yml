# Збирає готовий архів для хостингу (MonsterASP.NET / будь-який IIS) при кожній зміні в main.
# Архів: вкладка Actions → останній запуск → Artifacts → WorksArchive-hosting.
name: Build hosting package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish WorksArchive/WorksArchive.csproj -c Release -o publish
      - name: Remove files not needed on Windows/IIS hosting
        run: |
          cd publish
          for d in runtimes/*; do case "$(basename $d)" in win-x64|win-x86|win-arm64|linux-x64) ;; *) rm -rf "$d";; esac; done
          rm -f WorksArchive appsettings.Development.json
      - uses: actions/upload-artifact@v4
        with:
          name: WorksArchive-hosting
          path: publish/
